services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: local-demo-password
      POSTGRES_DB: knowledge
    volumes:
      - knowledge_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U knowledge -d knowledge"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://knowledge:local-demo-password@db:5432/knowledge
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  knowledge_data:
